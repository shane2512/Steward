services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: steward
      POSTGRES_PASSWORD: steward
      POSTGRES_DB: steward
    ports:
      - '5433:5432' # 5433 on the host: 5432 is commonly taken by a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U steward -d steward']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
