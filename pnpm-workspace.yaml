packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  # Transitive deps of @coinbase/agentkit. All are optional native accelerations (or unrelated
  # marketplace postinstalls) with pure-JS fallbacks, so we deliberately do NOT run their build
  # scripts — less arbitrary code at install time, no functional loss. See PROGRESS D-19.
  '@coinbase/x402': false
  '@opensea/seaport-js': false
  bigint-buffer: false
  bufferutil: false
  keccak: false
  opensea-js: false
  secp256k1: false
  utf-8-validate: false
