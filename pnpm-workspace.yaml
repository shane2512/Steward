packages:
  - apps/*
  - packages/*
# Three different major viem versions were resolving side by side (2.23.2, 2.38.3, 2.56.8), each
# with its own @noble/hashes pairing — webpack bundled two of them into the same chunk and crashed
# at build time (TypeError in @noble/hashes' sha3.js, hit via viem's keccak256/getAddress while
# collecting page data). Force one version everywhere.
overrides:
  viem: 2.56.8
allowBuilds:
  esbuild: true
  sharp: true
  # Transitive deps of @coinbase/agentkit. All are optional native accelerations (or unrelated
  # marketplace postinstalls) with pure-JS fallbacks, so we deliberately do NOT run their build
  # scripts — less arbitrary code at install time, no functional loss. See PROGRESS D-19.
  '@coinbase/x402': false
  '@opensea/seaport-js': false
  bigint-buffer: false
  bufferutil: false
  keccak: false
  opensea-js: false
  secp256k1: false
  utf-8-validate: false
